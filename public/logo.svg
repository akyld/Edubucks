<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="#000000"/>
  <circle cx="100" cy="100" r="90" stroke="#FF7A00" stroke-width="4"/>
  
  <!-- Graduation Cap -->
  <g transform="translate(100, 100)">
    <!-- Cap Base -->
    <path d="M -40 -20 L 0 -35 L 40 -20 L 40 0 L -40 0 Z" fill="#FF7A00"/>
    <path d="M -40 -20 L 0 -35 L 40 -20 L 0 -5 Z" fill="#FF8C1A"/>
    
    <!-- Cap Top -->
    <rect x="-5" y="-45" width="10" height="15" fill="#FF7A00"/>
    <circle cx="0" cy="-45" r="8" fill="#FF7A00"/>
    
    <!-- Tassel -->
    <line x1="0" y1="-45" x2="12" y2="-52" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="12" cy="-52" r="3" fill="#FFFFFF"/>
  </g>
  
  <!-- Letter "E" -->
  <text x="100" y="135" font-family="Arial, sans-serif" font-size="45" font-weight="bold" fill="#FFFFFF" text-anchor="middle">E</text>
  
  <!-- Dollar Sign -->
  <text x="100" y="165" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#FF7A00" text-anchor="middle">$</text>
</svg>

